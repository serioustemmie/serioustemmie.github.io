<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Library</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0d12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #top-bar {
            padding: 15px 30px;
            background: rgba(13, 13, 18, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 20;
            display: flex;
            justify-content: space-between; 
            align-items: center;
        }

        #nav-left {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.active, .nav-btn:hover {
            background-color: #ff477e;
            border-color: #ff477e;
            box-shadow: 0px 4px 15px rgba(255, 71, 126, 0.4);
            transform: translateY(-2px);
        }

        /* --- SEARCH BAR UI --- */
        #search-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 6px 16px;
            transition: all 0.3s ease;
        }

        #search-container:focus-within {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ff477e;
            box-shadow: 0 0 15px rgba(255, 71, 126, 0.2);
        }

        #search-container svg {
            width: 16px;
            height: 16px;
            color: #aaa;
            margin-right: 10px;
        }

        #search-bar {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            width: 220px;
            padding: 5px 0;
        }

        #search-bar::placeholder {
            color: #888;
        }

        #workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* GRID VIEW */
        #grid-view {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            grid-auto-rows: max-content; 
            align-content: start; 
            gap: 25px;
            overflow-y: auto;
            z-index: 15;
            background-color: #0d0d12;
            transition: opacity 0.4s ease;
        }

        .weapon-card {
            background: linear-gradient(145deg, #1f1f2a, #15151e);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .weapon-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ff477e;
            box-shadow: 0px 15px 30px rgba(255, 71, 126, 0.2);
        }

        .card-thumb {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; 
            padding: 20px;
            box-sizing: border-box;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .weapon-card:hover .card-thumb { transform: scale(1.1); }

        .card-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 50%);
            z-index: 2;
        }

        .card-title {
            position: relative;
            z-index: 3;
            padding: 15px;
            font-size: 20px;
            font-weight: 800;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* DETAIL VIEW */
        #detail-view {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        #detail-view.active {
            opacity: 1;
            pointer-events: all;
        }

        #viewer-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1a1a24 0%, #0d0d12 100%);
        }
        
        canvas { width: 100%; height: 100%; display: block; outline: none; }

        /* CAMERA CONTROLS UI */
        #camera-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }

        .cam-btn {
            background: rgba(20, 20, 28, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
        }

        .cam-btn svg { width: 20px; height: 20px; }

        .cam-btn:hover {
            background: #ff477e;
            border-color: #ff477e;
            transform: translateY(-2px);
        }

        /* REDESIGNED SIDEBAR */
        #sidebar {
            width: 320px;
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 20;
            box-shadow: 10px 0px 30px rgba(0,0,0,0.5);
        }

        #detail-view.active #sidebar { transform: translateX(0); }

        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-thumb { background: rgba(255,71,126,0.3); border-radius: 10px; }

        .back-btn {
            background: rgba(255,255,255,0.03);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .back-btn:hover { background: rgba(255,71,126,0.1); color: white; border-color: #ff477e; }

        .sidebar-header { border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        h2 { margin: 0; font-size: 28px; font-weight: 900; color: white; letter-spacing: 1px; text-shadow: 0px 2px 10px rgba(0,0,0,0.5); }
        .subtitle { color: #ff477e; font-size: 13px; text-transform: uppercase; font-weight: 800; letter-spacing: 2px; margin-bottom: 5px; display: block; }
        
        h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #666; margin-bottom: 10px;}

        .list-container { display: flex; flex-direction: column; gap: 8px; }
        
        .list-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-left: 4px solid transparent;
            padding: 14px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #ddd;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .list-item:hover {
            background: rgba(255,255,255,0.05);
            color: white;
            transform: translateX(4px);
        }

        .list-item.active {
            background: linear-gradient(90deg, rgba(255,71,126,0.15) 0%, rgba(255,71,126,0) 100%);
            border-color: rgba(255,71,126,0.2);
            border-left: 4px solid #ff477e;
            color: white;
            font-weight: 700;
        }

        /* MAIN ACTION BAR UI */
        #action-bar {
            position: absolute;
            bottom: 40px;
            left: calc(50% + 160px); 
            transform: translate(-50%, 150px); 
            display: flex;
            gap: 15px;
            background: rgba(20, 20, 28, 0.9);
            backdrop-filter: blur(20px);
            padding: 15px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0px 15px 35px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 30;
        }

        #action-bar.visible { transform: translate(-50%, 0); }

        .action-btn {
            background: #ff477e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover:not(.disabled) {
            transform: translateY(-2px);
            background: #ff2a6d;
            box-shadow: 0px 5px 15px rgba(255, 71, 126, 0.4);
        }

        .action-btn.disabled {
            background: #2a2a35;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* --- OTHER ASSETS WIDGET UI --- */
        #other-assets-wrapper {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 30;
            transform: translateY(150px);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none;
        }

        #other-assets-wrapper.visible {
            transform: translateY(0);
            pointer-events: all;
        }

        #btn-other-assets {
            background: rgba(20, 20, 28, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            z-index: 3; 
        }

        #btn-other-assets.close-mode {
            background: #ef4444; 
            border-color: #ef4444;
        }

        #btn-other-assets.close-mode:hover {
            background: #dc2626;
            box-shadow: 0px 5px 15px rgba(239, 68, 68, 0.4);
        }

        #other-assets-menu {
            position: absolute;
            bottom: 60px;
            right: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: rgba(20, 20, 28, 0.95);
            backdrop-filter: blur(20px);
            padding: 10px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
            transform-origin: bottom right;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 2;
        }

        #other-assets-menu.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0) scale(1);
        }

        .menu-btn {
            background: transparent;
            color: #ddd;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: right;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .menu-btn:hover { background: rgba(255,255,255,0.05); color: #ff477e; }

        #other-assets-panel {
            position: absolute;
            bottom: 60px;
            right: 0;
            width: 210px; 
            background: rgba(18, 18, 24, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0px 15px 35px rgba(0,0,0,0.6);
            opacity: 0;
            pointer-events: none;
            transform: translateY(30px) scale(0.95);
            transform-origin: bottom right;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        #other-assets-panel.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0) scale(1);
        }

        .panel-header {
            font-size: 16px;
            font-weight: 800;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            display: flex;
            justify-content: flex-end; 
            align-items: center;
            gap: 8px;
        }

        #panel-list {
            overflow-y: auto;
            max-height: 220px;
            padding-left: 5px; 
        }

        #panel-list::-webkit-scrollbar { width: 4px; }
        #panel-list::-webkit-scrollbar-thumb { background: rgba(255,71,126,0.3); border-radius: 10px; }

        #panel-list .list-item {
            text-align: right;
            border-left: none; 
            border-right: 4px solid transparent; 
        }

        #panel-list .list-item:hover {
            transform: translateX(-4px); 
            background: linear-gradient(-90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
        }

        #panel-list .list-item:active {
            background: linear-gradient(-90deg, rgba(255,71,126,0.15) 0%, rgba(255,71,126,0) 100%);
            border-right-color: #ff477e;
            color: white;
            transform: translateX(-2px);
        }

        /* Styles for Accordion Dropdown Sub-Items */
        #panel-list .sub-item {
            font-size: 12px;
            padding: 10px 14px;
            background: transparent;
            border: none;
            border-right: 2px solid rgba(255,71,126,0.3);
            border-radius: 0;
            color: #aaa;
            margin-bottom: 2px;
        }

        #panel-list .sub-item:hover {
            color: white;
            border-right-color: #ff477e;
            background: rgba(255,255,255,0.02);
            transform: translateX(0); /* Sub items shouldn't shift as much */
        }

        .tooltip-container { position: relative; display: inline-block; }

        .tooltip-text {
            visibility: hidden;
            background-color: rgba(10, 10, 15, 0.95);
            color: #ff477e;
            text-align: center;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 71, 126, 0.3);
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 700;
            pointer-events: none;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
        }

        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        #toast {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translate(-50%, -150px);
            background: #22c55e;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0px 10px 20px rgba(34, 197, 94, 0.3);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 40;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #toast.show { transform: translate(-50%, 0); }
    </style>
</head>
<body>

    <div id="top-bar">
        <div id="nav-left">
            <button class="nav-btn active" onclick="loadCategory('Weapons')">Weapons</button>
        </div>
        
        <div id="search-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-bar" placeholder="Search library..." oninput="filterItems()">
        </div>
    </div>

    <div id="toast">Action Successful!</div>

    <div id="workspace">
        <div id="grid-view"></div>

        <div id="detail-view">
            <div id="sidebar">
                <button class="back-btn" onclick="closeDetailView()">◄ Return to Library</button>
                <div class="sidebar-header">
                    <span class="subtitle">Inspecting</span>
                    <h2 id="detail-title">Weapon</h2>
                </div>
                <div>
                    <h3>Skins</h3>
                    <div id="skins-list" class="list-container"></div>
                </div>
                <div>
                    <h3>Mesh Parts</h3>
                    <div id="parts-list" class="list-container"></div>
                </div>
            </div>

            <div id="action-bar">
                <button id="btn-download" class="action-btn" onclick="downloadCurrentMesh()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download Mesh
                </button>
                <div class="tooltip-container">
                    <button id="btn-copy" class="action-btn" onclick="copyAssetId()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy Asset ID
                    </button>
                    <span id="copy-tooltip" class="tooltip-text">There currently is no asset ID for this mesh.</span>
                </div>
            </div>

            <div id="other-assets-wrapper">
                <div id="other-assets-panel">
                    <div class="panel-header" id="panel-title">Assets</div>
                    <div class="panel-content list-container" id="panel-list"></div>
                </div>

                <div id="other-assets-menu">
                    <button class="menu-btn" onclick="openAssetPanel('Sounds')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                        Sounds
                    </button>
                    <button class="menu-btn" onclick="openAssetPanel('Animations')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Animations
                    </button>
                </div>

                <button id="btn-other-assets" class="action-btn" onclick="toggleOtherAssetsMenu()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    Other Assets
                </button>
            </div>

            <div id="viewer-container">
                <div id="camera-controls">
                    <button class="cam-btn" onclick="resetCamera()" title="Reset Camera">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M3 12h3m12 0h3M12 3v3m0 12v3"></path></svg>
                    </button>
                </div>
                <canvas id="viewer-canvas"></canvas>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const repoBaseUrl = 'https://api.github.com/repos/serioustemmie/serioustemmie.github.io/contents';
        const rawBaseUrl = 'https://raw.githubusercontent.com/serioustemmie/serioustemmie.github.io/main';

        // --- 1. SETUP MAIN VIEWER ---
        const canvas = document.getElementById('viewer-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedMeshUuid = null;
        let hoveredMeshUuid = null;
        let mouseDownPosition = new THREE.Vector2();

        // --- 2. SETUP SNAPSHOT ENGINE ---
        const thumbRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        thumbRenderer.setSize(300, 300); 
        const thumbScene = new THREE.Scene();
        const thumbCamera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
        
        thumbScene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const thumbDir = new THREE.DirectionalLight(0xffffff, 2.0);
        thumbDir.position.set(10, 20, 20);
        thumbScene.add(thumbDir);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const container = document.getElementById('viewer-container');
            if (container.clientWidth > 0) {
                renderer.setSize(container.clientWidth, container.clientHeight);
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
            }
        });

        // --- 3. UI, GITHUB LOGIC & DATA STATE ---
        let currentCategory = '';
        let currentWeapon = '';
        let currentSkin = '';
        let loadedModel = null;
        let originalMaterials = new Map();
        let currentModelIds = {}; 

        let currentAudios = null;
        let currentAnims = null;

        let currentPartId = null;
        let selectedMeshForExport = null;

        const defaultGreyMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x909090, 
            roughness: 0.6,
            metalness: 0.1,
            side: THREE.DoubleSide 
        });

        window.filterItems = function() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const cards = document.querySelectorAll('.weapon-card');
            
            cards.forEach(card => {
                const title = card.querySelector('.card-title').innerText.toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        window.loadCategory = async function(categoryName) {
            currentCategory = categoryName;
            const gridView = document.getElementById('grid-view');
            document.getElementById('search-bar').value = ''; 
            
            gridView.innerHTML = '<h3 style="padding: 20px;">Loading Catalog...</h3>';

            try {
                const response = await fetch(`${repoBaseUrl}/${categoryName}`);
                const files = await response.json();
                
                gridView.innerHTML = '';
                files.forEach(file => {
                    if (file.type === 'dir') {
                        const cardId = `thumb-${file.name}`;
                        const card = document.createElement('div');
                        card.className = 'weapon-card';
                        
                        card.innerHTML = `
                            <img id="${cardId}" class="card-thumb">
                            <div class="card-overlay"></div>
                            <div class="card-title">${file.name}</div>
                        `;
                        
                        card.onclick = () => openWeaponDetail(file.name);
                        gridView.appendChild(card);

                        generateThumbnail(categoryName, file.name, cardId);
                    }
                });
            } catch (error) {
                gridView.innerHTML = '<h3 style="color:#ff477e;">Failed to load from GitHub.</h3>';
            }
        }

        // --- 4. BULLETPROOF SNAPSHOT GENERATOR ---
        async function generateThumbnail(category, weaponName, imgId) {
            const basePath = `${rawBaseUrl}/${category}/${weaponName}/`;
            const objLoader = new OBJLoader();
            objLoader.setPath(basePath);

            const handleSuccess = function(object) {
                object.traverse(child => {
                    if (child.isMesh) child.material = defaultGreyMaterial.clone();
                });
                takeSnapshot(object, imgId);
            };

            objLoader.load('Default.obj', handleSuccess, undefined, function() {
                objLoader.load('default.obj', handleSuccess, undefined, function() {
                    objLoader.load('preview.obj', handleSuccess, undefined, function() {
                        console.warn(`Could not find a preview model for ${weaponName}`);
                    });
                });
            });
        }

        function takeSnapshot(object, imgId) {
            thumbScene.children = thumbScene.children.filter(c => c.type === 'Light'); 
            
            object.rotation.z = -Math.PI / 4; 
            object.rotation.x = Math.PI / 6;  
            object.rotation.y = Math.PI / 8;  
            
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            object.position.sub(center);
            thumbScene.add(object);
            
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y); 
            thumbCamera.position.z = maxDim * 1.2; 
            thumbCamera.lookAt(0,0,0);
            
            thumbRenderer.render(thumbScene, thumbCamera);
            const dataUrl = thumbRenderer.domElement.toDataURL('image/png');
            
            const imgElement = document.getElementById(imgId);
            if (imgElement) {
                imgElement.src = dataUrl;
                imgElement.style.opacity = 0;
                imgElement.style.transition = "opacity 0.4s ease-in-out, transform 0.3s ease";
                setTimeout(() => imgElement.style.opacity = 1, 50);
            }
        }

        // --- 5. ACTION BAR & CAMERA CONTROLS ---
        window.resetCamera = function() {
            if (!loadedModel) return;
            const box = new THREE.Box3().setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            camera.position.set(center.x, center.y, center.z + Math.max(size.x, size.y, size.z) * 1.5);
            controls.target.copy(center);
            controls.update();
        }

        // --- OTHER ASSETS WIDGET LOGIC ---

function parseAssetTxt(text) {
    const result = {};
    let currentSkinContext = null;
    const lines = text.split('\n');
    
    for (let line of lines) {
        if (line.trim() === '') continue;
        
        // UPGRADED: Uses Regex to catch ALL types of whitespace (including non-breaking spaces)
        if (/^\s+/.test(line)) {
            if (currentSkinContext) {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    const originalName = parts[0].trim();
                    const id = parts.slice(1).join(':').trim(); 
                    
                    const groupName = originalName.replace(/\s*\d+$/, '').trim();

                    if (!result[currentSkinContext][groupName]) {
                        result[currentSkinContext][groupName] = [];
                    }
                    result[currentSkinContext][groupName].push({ name: originalName, id: id });
                }
            }
        } else {
            // It's a Skin Header (e.g. "Default:")
            currentSkinContext = line.replace(':', '').trim();
            result[currentSkinContext] = {};
        }
    }
    return result;
}

        window.toggleOtherAssetsMenu = function() {
            const panel = document.getElementById('other-assets-panel');
            const menu = document.getElementById('other-assets-menu');

            if (panel.classList.contains('active')) {
                window.closeAssetPanel();
            } else {
                menu.classList.toggle('active');
            }
        }

        window.openAssetPanel = function(type) {
            const menu = document.getElementById('other-assets-menu');
            const panel = document.getElementById('other-assets-panel');
            const btn = document.getElementById('btn-other-assets');
            const title = document.getElementById('panel-title');
            const list = document.getElementById('panel-list');

            menu.classList.remove('active');

            let iconSvg = type === 'Sounds' 
                ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`
                : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
            
            title.innerHTML = `${iconSvg} ${type}`;
            list.innerHTML = ''; 

            const assetData = type === 'Sounds' ? currentAudios : currentAnims;

            if (!assetData || !assetData[currentSkin] || Object.keys(assetData[currentSkin]).length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'list-item';
                emptyMsg.style.color = '#888';
                emptyMsg.style.cursor = 'default';
                emptyMsg.innerText = 'None exist!';
                list.appendChild(emptyMsg);
            } else {
                const skinAssets = assetData[currentSkin];
                
                for (const [groupName, assets] of Object.entries(skinAssets)) {
                    if (assets.length === 1) {
                        // Standard single item
                        const item = document.createElement('div');
                        item.className = 'list-item';
                        item.innerText = `${assets[0].name} (${assets[0].id})`;
                        item.onclick = () => {
                            navigator.clipboard.writeText(assets[0].id).then(() => {
                                showToast(`${assets[0].name} ID Copied!`);
                            });
                        };
                        list.appendChild(item);
                    } else {
                        // Create Accordion Group
                        const groupContainer = document.createElement('div');
                        groupContainer.style.display = 'flex';
                        groupContainer.style.flexDirection = 'column';
                        groupContainer.style.gap = '5px';

                        const groupHeader = document.createElement('div');
                        groupHeader.className = 'list-item';
                        groupHeader.innerHTML = `<span style="color:#aaa; font-size: 11px; margin-right: 5px;">(${assets.length} IDs) ▼</span> ${groupName}`;

                        const subList = document.createElement('div');
                        subList.style.display = 'none'; // Hidden by default
                        subList.style.flexDirection = 'column';
                        subList.style.gap = '2px';

                        groupHeader.onclick = () => {
                            const isHidden = subList.style.display === 'none';
                            subList.style.display = isHidden ? 'flex' : 'none';
                            groupHeader.innerHTML = `<span style="color:#aaa; font-size: 11px; margin-right: 5px;">(${assets.length} IDs) ${isHidden ? '▲' : '▼'}</span> ${groupName}`;
                        };

                        assets.forEach(asset => {
                            const subItem = document.createElement('div');
                            subItem.className = 'list-item sub-item';
                            subItem.innerText = `${asset.name} (${asset.id})`;
                            subItem.onclick = (e) => {
                                e.stopPropagation(); // Stop click from closing the accordion
                                navigator.clipboard.writeText(asset.id).then(() => {
                                    showToast(`${asset.name} ID Copied!`);
                                });
                            };
                            subList.appendChild(subItem);
                        });

                        groupContainer.appendChild(groupHeader);
                        groupContainer.appendChild(subList);
                        list.appendChild(groupContainer);
                    }
                }
            }

            panel.classList.add('active');
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> Close`;
            btn.classList.add('close-mode');
        }

        window.closeAssetPanel = function() {
            const panel = document.getElementById('other-assets-panel');
            const btn = document.getElementById('btn-other-assets');
            const menu = document.getElementById('other-assets-menu');

            panel.classList.remove('active');
            menu.classList.remove('active');
            
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg> Other Assets`;
            btn.classList.remove('close-mode');
        }

        function triggerActionBar(mesh) {
            selectedMeshForExport = mesh;
            const actionBar = document.getElementById('action-bar');
            const btnDownload = document.getElementById('btn-download');
            const btnCopy = document.getElementById('btn-copy');
            const tooltip = document.getElementById('copy-tooltip');
            
            btnDownload.classList.remove('disabled');
            
            const foundId = mesh.name ? currentModelIds[mesh.name] : null;
            
            if (foundId) {
                currentPartId = foundId;
                btnCopy.classList.remove('disabled');
                tooltip.style.display = 'none'; 
            } else {
                currentPartId = null;
                btnCopy.classList.add('disabled');
                tooltip.style.display = 'block';
                tooltip.innerText = "There currently is no asset ID for this mesh.";
            }

            actionBar.classList.add('visible');
            document.getElementById('other-assets-wrapper').classList.add('visible');
        }

        function hideActionBar() {
            document.getElementById('action-bar').classList.remove('visible');
            selectedMeshForExport = null;
            
            document.getElementById('other-assets-wrapper').classList.remove('visible');
            window.closeAssetPanel();
        }

        window.downloadCurrentMesh = function() {
            if (!selectedMeshForExport) return;
            const exporter = new OBJExporter();
            const objText = exporter.parse(selectedMeshForExport);
            
            let filename = currentWeapon + '.obj';
            if (selectedMeshForExport !== loadedModel && selectedMeshForExport.name) {
                filename = selectedMeshForExport.name.split('_')[0] + '.obj';
            }

            const blob = new Blob([objText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Mesh Downloaded!");
        }

        window.copyAssetId = function() {
            if (!currentPartId) return;
            navigator.clipboard.writeText(currentPartId).then(() => {
                showToast("Roblox Asset ID Copied!");
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.selectMesh = function(uuid) {
            selectedMeshUuid = uuid;
            updateMaterials();

            const partsList = document.getElementById('parts-list');
            Array.from(partsList.children).forEach(c => c.classList.remove('active'));
            
            if (uuid === null) {
                partsList.children[0].classList.add('active'); 
            } else {
                const activeBtn = Array.from(partsList.children).find(c => c.dataset.uuid === uuid);
                if (activeBtn) {
                    activeBtn.classList.add('active');
                    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function updateMaterials() {
            if (!loadedModel) return;

            loadedModel.traverse(function(child) {
                if (child.isMesh && originalMaterials.has(child.uuid)) {
                    child.material = originalMaterials.get(child.uuid).clone();
                    
                    if (child.uuid === selectedMeshUuid) {
                        child.material.emissive = new THREE.Color(0xff477e);
                        child.material.emissiveIntensity = 0.6;
                        child.material.transparent = false;
                        child.material.opacity = 1.0;
                    } 
                    else if (child.uuid === hoveredMeshUuid) {
                        child.material.emissive = new THREE.Color(0xffffff);
                        child.material.emissiveIntensity = 0.3;
                        child.material.transparent = false;
                        child.material.opacity = 1.0;
                    } 
                    else if (selectedMeshUuid !== null) {
                        child.material.transparent = true;
                        child.material.opacity = 0.3;
                    }
                }
            });
        }

        // --- RAYCASTING EVENT LISTENERS ---
        renderer.domElement.addEventListener('mousemove', (event) => {
            if (!loadedModel) return;
            
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(loadedModel, true);

            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (hoveredMeshUuid !== object.uuid) {
                    hoveredMeshUuid = object.uuid;
                    renderer.domElement.style.cursor = 'pointer';
                    updateMaterials();
                }
            } else {
                if (hoveredMeshUuid !== null) {
                    hoveredMeshUuid = null;
                    renderer.domElement.style.cursor = 'default';
                    updateMaterials();
                }
            }
        });

        renderer.domElement.addEventListener('pointerdown', (event) => {
            mouseDownPosition.set(event.clientX, event.clientY);
        });

        renderer.domElement.addEventListener('pointerup', (event) => {
            if (!loadedModel) return;

            const currentPosition = new THREE.Vector2(event.clientX, event.clientY);
            const deltaMove = currentPosition.distanceTo(mouseDownPosition);

            if (deltaMove > 5) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(loadedModel, true);

            if (intersects.length > 0) {
                const object = intersects[0].object;
                selectMesh(object.uuid);
                triggerActionBar(object);
            } else {
                selectMesh(null);
                triggerActionBar(loadedModel); 
            }
        });

        // --- 6. RAW TEXT PARSER ---
        function extractIdsFromOBJ(text) {
            let currentGroup = null;
            const lines = text.split('\n');
            
            for (let line of lines) {
                line = line.trim();
                
                if (line.startsWith('g ') || line.startsWith('o ')) {
                    currentGroup = line.substring(2).trim();
                } 
                else if (line.startsWith('#') && currentGroup) {
                    const potentialId = line.substring(1).trim();
                    if (/^\d{7,}$/.test(potentialId)) {
                        currentModelIds[currentGroup] = potentialId;
                    }
                    currentGroup = null; 
                }
            }
        }

        // --- 7. MAIN DETAIL VIEWER ---
        window.openWeaponDetail = async function(weaponName) {
            currentWeapon = weaponName;
            document.getElementById('detail-title').innerText = weaponName;
            
            document.getElementById('grid-view').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('grid-view').style.display = 'none';
                document.getElementById('detail-view').classList.add('active');
                window.dispatchEvent(new Event('resize'));
            }, 400);

            const skinsList = document.getElementById('skins-list');
            skinsList.innerHTML = 'Loading...';
            hideActionBar();
            
            const basePath = `${rawBaseUrl}/${currentCategory}/${weaponName}/`;

            currentAudios = null;
            currentAnims = null;

            fetch(basePath + 'Audios.txt')
                .then(res => res.ok ? res.text() : null)
                .then(text => { if (text) currentAudios = parseAssetTxt(text); });

            fetch(basePath + 'Anims.txt')
                .then(res => res.ok ? res.text() : null)
                .then(text => { if (text) currentAnims = parseAssetTxt(text); });

            try {
                const response = await fetch(`${repoBaseUrl}/${currentCategory}/${weaponName}`);
                const files = await response.json();
                
                skinsList.innerHTML = '';
                let targetSkin = null;
                let foundDefault = false;

                files.forEach(file => {
                    if (file.name.toLowerCase().endsWith('.obj')) {
                        const skinName = file.name.substring(0, file.name.length - 4); 
                        if (skinName.toLowerCase() === 'default') foundDefault = true;
                        
                        const btn = document.createElement('div');
                        btn.className = 'list-item';
                        btn.innerText = skinName;
                        btn.onclick = (e) => {
                            Array.from(skinsList.children).forEach(c => c.classList.remove('active'));
                            e.target.classList.add('active');
                            currentSkin = skinName;
                            
                            const panel = document.getElementById('other-assets-panel');
                            if (panel.classList.contains('active')) {
                                const currentPanelType = document.getElementById('panel-title').innerText.trim();
                                openAssetPanel(currentPanelType);
                            }

                            load3DModel(skinName);
                        };
                        skinsList.appendChild(btn);
                    }
                });

                if (skinsList.children.length > 0) {
                    if (foundDefault) {
                        Array.from(skinsList.children).forEach(c => {
                            if (c.innerText.toLowerCase() === 'default') {
                                c.classList.add('active');
                                targetSkin = c.innerText;
                            }
                        });
                    } else {
                        targetSkin = skinsList.children[0].innerText;
                        skinsList.children[0].classList.add('active');
                    }
                    currentSkin = targetSkin;
                    load3DModel(targetSkin);
                } else {
                    skinsList.innerHTML = '<span style="color:#aaa;">No .obj skins found.</span>';
                }

            } catch (error) {
                skinsList.innerHTML = 'Error loading skins.';
            }
        }

        window.closeDetailView = function() {
            document.getElementById('detail-view').classList.remove('active');
            hideActionBar();
            setTimeout(() => {
                document.getElementById('grid-view').style.display = 'grid';
                void document.getElementById('grid-view').offsetWidth; 
                document.getElementById('grid-view').style.opacity = '1';
                
                scene.children = scene.children.filter(child => child.type === 'Light');
                loadedModel = null;
                selectedMeshUuid = null;
            }, 400);
        }

        window.load3DModel = async function(skinName) {
            scene.children = scene.children.filter(child => child.type === 'Light');
            document.getElementById('parts-list').innerHTML = 'Loading geometry...';
            originalMaterials.clear();
            loadedModel = null;
            selectedMeshUuid = null;
            currentModelIds = {}; 
            hideActionBar();

            const basePath = `${rawBaseUrl}/${currentCategory}/${currentWeapon}/`;
            const objFilename = `${skinName}.obj`;

            try {
                const res = await fetch(basePath + objFilename);
                if (res.ok) {
                    const text = await res.text();
                    extractIdsFromOBJ(text);
                }
            } catch(e) {
                console.warn("Failed to fetch raw OBJ for ID parsing");
            }

            const objLoader = new OBJLoader();
            objLoader.setPath(basePath);
            objLoader.load(objFilename, function(object) {
                object.traverse(child => {
                    if (child.isMesh) child.material = defaultGreyMaterial.clone();
                });
                processLoadedModel(object);
            });
        }

        function processLoadedModel(object) {
            loadedModel = object;
            const partsList = document.getElementById('parts-list');
            partsList.innerHTML = '';
            
            const fullBtn = document.createElement('div');
            fullBtn.className = 'list-item active';
            fullBtn.innerText = 'Whole Weapon';
            fullBtn.dataset.uuid = 'all'; 
            fullBtn.onclick = (e) => {
                selectMesh(null);
                triggerActionBar(object); 
            };
            partsList.appendChild(fullBtn);

            let partCount = 0;
            object.traverse(function(child) {
                if (child.isMesh) {
                    partCount++;
                    originalMaterials.set(child.uuid, child.material.clone());

                    const meshName = child.name || `MeshPart_${partCount}`;
                    const btn = document.createElement('div');
                    btn.className = 'list-item';
                    
                    btn.dataset.uuid = child.uuid;
                    
                    const cleanName = meshName.split('_')[0];
                    btn.innerText = cleanName;
                    
                    btn.onclick = (e) => {
                        selectMesh(child.uuid);
                        triggerActionBar(child); 
                    };
                    partsList.appendChild(btn);
                }
            });

            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            object.position.sub(center);
            scene.add(object);
            
            resetCamera();
            
            triggerActionBar(object);
        }
        
        window.loadCategory('Weapons');
    </script>
